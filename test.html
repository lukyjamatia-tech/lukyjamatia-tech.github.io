<!DOCTYPE html>
<html><body>
<button id="b" style="font-size:24px;padding:20px">Sign in</button>
<pre id="o" style="font-size:13px;white-space:pre-wrap"></pre>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyCH1s6Cf2Zx2CZVv5HUUu2P7TwHEqoxWW8",
  authDomain: "findback.org",
  projectId: "findback-app-34e4f",
  messagingSenderId: "504207496092",
  appId: "1:504207496092:web:b9d6918639ed23ddad6e59"
});
var o = document.getElementById('o');
document.getElementById('b').onclick = function(){
  o.textContent = "trying...";
  firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .then(function(r){ o.textContent = "OK: " + r.user.email; })
    .catch(function(e){
      o.textContent = "CODE: " + e.code + "\n\nMSG: " + e.message
        + "\n\nRAW: " + JSON.stringify(e, Object.getOwnPropertyNames(e));
    });
};
</script>
</body></html>
